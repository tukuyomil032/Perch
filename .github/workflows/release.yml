name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v0.3.0 or v0.3.0-beta.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Build arm64 and x86_64 in parallel on separate runners
  # ─────────────────────────────────────────────────────────────────────────
  build:
    strategy:
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-26
    env:
      SCHEME: perch
      APP_NAME: perch

    steps:
      - uses: actions/checkout@v4

      - name: Cache DerivedData (${{ matrix.arch }})
        uses: actions/cache@v4
        with:
          path: build/DerivedData
          key: ${{ runner.os }}-dd-release-${{ matrix.arch }}-${{ hashFiles('perch.xcodeproj/project.pbxproj', 'perch.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-dd-release-${{ matrix.arch }}-

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          BASE_VERSION="${VERSION%%-*}"
          echo "version=$VERSION"           >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"                   >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.arch }} archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "build/$APP_NAME-${{ matrix.arch }}.xcarchive" \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -jobs "$(sysctl -n hw.logicalcpu)" \
            "ARCHS=${{ matrix.arch }}" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.base_version }}" \
            SKIP_INSTALL=NO 2>&1 | tail -100

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.arch }}
          path: build/${{ env.APP_NAME }}-${{ matrix.arch }}.xcarchive
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────
  # Combine with lipo → sign → DMG → GitHub Release
  # ─────────────────────────────────────────────────────────────────────────
  release:
    needs: build
    runs-on: macos-26
    env:
      SCHEME: perch
      APP_NAME: perch

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          BASE_VERSION="${VERSION%%-*}"
          echo "version=$VERSION"           >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"                   >> "$GITHUB_OUTPUT"

      - name: Download arm64 archive
        uses: actions/download-artifact@v4
        with:
          name: archive-arm64
          path: build/${{ env.APP_NAME }}-arm64.xcarchive

      - name: Download x86_64 archive
        uses: actions/download-artifact@v4
        with:
          name: archive-x86_64
          path: build/${{ env.APP_NAME }}-x86_64.xcarchive

      - name: Create universal app with lipo
        run: |
          ARM64_APP="build/$APP_NAME-arm64.xcarchive/Products/Applications/$APP_NAME.app"
          X86_APP="build/$APP_NAME-x86_64.xcarchive/Products/Applications/$APP_NAME.app"
          UNIVERSAL_APP="build/$APP_NAME.app"

          cp -R "$ARM64_APP" "$UNIVERSAL_APP"

          # Lipo all Mach-O binaries (main executable + any embedded frameworks)
          find "$UNIVERSAL_APP" -type f | while IFS= read -r f; do
            rel="${f#$UNIVERSAL_APP/}"
            arm_f="$ARM64_APP/$rel"
            x86_f="$X86_APP/$rel"
            if [ -f "$arm_f" ] && [ -f "$x86_f" ] && lipo -info "$arm_f" > /dev/null 2>&1; then
              lipo -create "$arm_f" "$x86_f" -output "$f"
            fi
          done

          echo "=== Universal binary check ==="
          lipo -info "$UNIVERSAL_APP/Contents/MacOS/$APP_NAME"

      - name: Ad-hoc sign app bundle
        run: |
          APP="build/$APP_NAME.app"
          codesign --force --deep --sign - --timestamp=none "${APP}"
          echo "Signed: ${APP}"

      - name: Create DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p build/dmg
          STAGING="build/dmg-staging"
          mkdir -p "$STAGING"
          cp -R "build/$APP_NAME.app" "$STAGING/$APP_NAME.app"
          hdiutil create \
            -volname "Perch" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "build/dmg/$APP_NAME-${VERSION}.dmg"
          echo "Created: $APP_NAME-${VERSION}.dmg"

      - name: Compose release body
        id: body
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "body<<__BODY__"
            echo "## Perch ${VERSION}"
            echo ""
            echo "### Install via Homebrew"
            echo '```bash'
            echo "brew tap tukuyomil032/tap"
            echo "brew install --cask perch"
            echo '```'
            echo ""
            echo "### Direct Download"
            echo "- **perch-${VERSION}.dmg** — Universal (Apple Silicon + Intel)"
            echo ""
            echo "> Not notarized by Apple. If Gatekeeper blocks it: right-click > Open > Open."
            echo "__BODY__"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Perch ${{ steps.version.outputs.version }}"
          body: ${{ steps.body.outputs.body }}
          files: |
            build/dmg/${{ env.APP_NAME }}-${{ steps.version.outputs.version }}.dmg
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, 'beta') }}
