name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      SCHEME: perch
      APP_NAME: perch

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME:-v0.3.0}"
          VERSION="${TAG#v}"
          BASE_VERSION="${VERSION%%-*}"
          if [[ "$VERSION" =~ -[a-zA-Z] ]]; then
            IS_BETA=true
            FORMULA_NAME="perch-beta"
          else
            IS_BETA=false
            FORMULA_NAME="perch"
          fi
          echo "version=$VERSION"         >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"                 >> "$GITHUB_OUTPUT"
          echo "is_beta=$IS_BETA"         >> "$GITHUB_OUTPUT"
          echo "formula_name=$FORMULA_NAME" >> "$GITHUB_OUTPUT"

      - name: Build arm64 archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/$APP_NAME-arm64.xcarchive \
            -destination 'generic/platform=macOS' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.base_version }}" \
            SKIP_INSTALL=NO 2>&1 | tail -5

      - name: Build x86_64 archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/$APP_NAME-x86_64.xcarchive \
            -destination 'generic/platform=macOS' \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.base_version }}" \
            SKIP_INSTALL=NO 2>&1 | tail -5

      - name: Build universal archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/$APP_NAME-universal.xcarchive \
            -destination 'generic/platform=macOS' \
            "ARCHS=arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.base_version }}" \
            SKIP_INSTALL=NO 2>&1 | tail -5

      - name: Create DMGs
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p build/dmg

          for ARCH in arm64 x86_64 universal; do
            APP="build/$APP_NAME-${ARCH}.xcarchive/Products/Applications/$APP_NAME.app"
            STAGING="build/dmg-staging-${ARCH}"
            rm -rf "$STAGING"
            mkdir -p "$STAGING"
            cp -R "$APP" "$STAGING/$APP_NAME.app"

            codesign --force --deep --sign - --timestamp=none "$STAGING/$APP_NAME.app"
            codesign --verify --deep --strict --verbose=4 "$STAGING/$APP_NAME.app"
            if ! spctl --assess --type execute --verbose=4 "$STAGING/$APP_NAME.app"; then
              echo "::warning::spctl rejected ad-hoc signed app for ${ARCH}; continuing."
            fi

            hdiutil create \
              -volname "Perch" \
              -srcfolder "$STAGING" \
              -ov -format UDZO \
              "build/dmg/$APP_NAME-${VERSION}-${ARCH}.dmg"

            echo "Created: $APP_NAME-${VERSION}-${ARCH}.dmg"
          done

      - name: Compute SHA256
        id: sha256
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA=$(shasum -a 256 "build/dmg/$APP_NAME-${VERSION}-universal.dmg" | awk '{print $1}')
          echo "universal=$SHA" >> "$GITHUB_OUTPUT"

      - name: Compose release body
        id: body
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IS_BETA="${{ steps.version.outputs.is_beta }}"
          FORMULA_NAME="${{ steps.version.outputs.formula_name }}"

          if [ "$IS_BETA" = "true" ]; then
            LABEL=" (beta)"
          else
            LABEL=""
          fi

          {
            echo "body<<__BODY__"
            echo "## Perch ${VERSION}${LABEL}"
            echo ""
            echo "### Install via Homebrew"
            echo '```bash'
            echo "brew tap tukuyomil032/tap"
            echo "brew install --cask ${FORMULA_NAME}"
            echo '```'
            echo ""
            echo "### Direct Download"
            echo "- **universal.dmg** (recommended) — Apple Silicon + Intel"
            echo "- **arm64.dmg** — Apple Silicon only"
            echo "- **x86_64.dmg** — Intel only"
            echo ""
            echo "> ⚠️ Not notarized by Apple. If Gatekeeper blocks it: right-click > Open > Open."
            echo "__BODY__"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Perch ${{ steps.version.outputs.version }}"
          body: ${{ steps.body.outputs.body }}
          files: |
            build/dmg/${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-arm64.dmg
            build/dmg/${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-x86_64.dmg
            build/dmg/${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-universal.dmg
          draft: false
          prerelease: ${{ steps.version.outputs.is_beta == 'true' }}

      - name: Update Homebrew tap
        if: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BASE_VERSION="${{ steps.version.outputs.base_version }}"
          TAG="${{ steps.version.outputs.tag }}"
          FORMULA_NAME="${{ steps.version.outputs.formula_name }}"
          SHA="${{ steps.sha256.outputs.universal }}"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/tukuyomil032/homebrew-tap.git" tap-repo
          cd tap-repo
          mkdir -p Casks

          cat > "Casks/${FORMULA_NAME}.rb" << FORMULA
          cask "${FORMULA_NAME}" do
            version "${VERSION}"
            sha256 "${SHA}"

            url "https://github.com/tukuyomil032/perch/releases/download/${TAG}/perch-${VERSION}-universal.dmg"
            name "Perch"
            desc "macOS Dynamic Island-style live hub"
            homepage "https://github.com/tukuyomil032/perch"

            app "perch.app"
          end
          FORMULA

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add "Casks/${FORMULA_NAME}.rb"
          git commit -m "chore: update ${FORMULA_NAME} to ${VERSION}"
          git push
