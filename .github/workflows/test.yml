# .github/workflows/test.yml
name: Test

on:
  push:
    branches:
      - "phase-**"
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode and Swift version
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-derived-data-test-${{ hashFiles('perch.xcodeproj/project.pbxproj', 'perch.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-derived-data-test-

      - name: Run Tests
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme perch \
            -configuration Debug \
            -destination 'platform=macOS' \
            -skip-testing:perchUITests \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -jobs "$(sysctl -n hw.logicalcpu)" \
            CODE_SIGNING_ALLOWED=NO \
            test \
            2>&1 | xcbeautify
